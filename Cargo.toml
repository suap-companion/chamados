[workspace]
members = [
    "crates/suap-core",
    "crates/chamados-core",
    "crates/chamados-cli",
    "crates/chamados-sync",
    "crates/chamados-mobile",
    "crates/chamados-app",
    "crates/chamados-assist",
    "crates/chamados-rag",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.54.0"

# Perfil das bibliotecas do aplicativo móvel: menor, não mais rápido (`cargo ndk ... --profile mobile`).
[profile.mobile]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# unwind (não abort): o leitor de PDF roda em catch_unwind, e um PDF malformado que o faça entrar em pânico
# vira um erro "arquivo corrompido" em vez de derrubar o app.
panic = "unwind"
