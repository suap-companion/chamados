[workspace]
members = [
    "crates/chamados-core",
    "crates/chamados-cli",
    "crates/chamados-sync",
    "crates/chamados-mobile",
    "crates/chamados-app",
    "crates/chamados-assist",
]
resolver = "2"

# Núcleo compartilhado (repositório suap-companion/suap-kit), fixado por tag.
[workspace.dependencies]
suap-core = { git = "https://github.com/suap-companion/suap-kit", tag = "v0.2.0" }
suap-rag = { git = "https://github.com/suap-companion/suap-kit", tag = "v0.2.0" }
suap-sync = { git = "https://github.com/suap-companion/suap-kit", tag = "v0.2.0" }

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.54.6"

# Perfil das bibliotecas do aplicativo móvel: menor, não mais rápido (`cargo ndk ... --profile mobile`).
[profile.mobile]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# unwind (não abort): o leitor de PDF roda em catch_unwind, e um PDF malformado que o faça entrar em pânico
# vira um erro "arquivo corrompido" em vez de derrubar o app.
panic = "unwind"
