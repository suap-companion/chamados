name: Pages

# Publica a central de ajuda (pasta site/) no GitHub Pages: https://suap-companion.github.io/chamados/
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar o Pages
        uses: actions/configure-pages@v6

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
