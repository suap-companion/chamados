[package]
name = "chamados-rag"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# SQLite embutido (com FTS5): o índice dos documentos é um arquivo SQLite com versão de esquema.
rusqlite = { version = "0.40", features = ["bundled"] }
# Texto de PDF por página (sem OCR).
pdf-extract = "0.12"
thiserror = "2"

[dev-dependencies]
chamados-app = { path = "../chamados-app" }
tempfile = "3"
# A mesma versão que o leitor de PDF usa: monta um PDF protegido para o teste.
lopdf = "0.42"
