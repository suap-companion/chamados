[package]
name = "chamados-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chamados-core = { path = "../chamados-core" }
chamados-sync = { path = "../chamados-sync" }
suap-core.workspace = true
serde_json = "1"
thiserror = "2"
# Desenha o QR do pareamento no terminal (sem recursos de imagem): evita escrever um codificador de QR.
qrcode = { version = "0.14", default-features = false }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
