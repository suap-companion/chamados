[package]
name = "chamados-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chamados-core = { path = "../chamados-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suap-core.workspace = true
suap-sync.workspace = true
url = "2"

[dev-dependencies]
suap-sync = { workspace = true, features = ["test-support"] }
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt"] }
